            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
            Retry-After:           { $ref: "#/components/headers/RetryAfter" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /tree-presets/{id}:
    get:
      operationId: getTreePreset
      tags: [TreePresets]
      summary: Load a single tree preset by id
      description: |
        Returns a full preset definition including its `operations` list.
        The `id` parameter must match `^[a-z0-9-]+$` and equal the JSON file's
        basename without the `.json` extension; any other value returns 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9-]+$"
            maxLength: 64
          example: lan-dmz-mgmt-24
      responses:
        "200":
          description: Full preset payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [preset]
                        properties:
                          preset:
                            type: object
                            required: [id, name, family, rootPrefix, operations]
                            properties:
                              id:          { type: string, pattern: "^[a-z0-9-]+$" }
                              name:        { type: string }
                              description: { type: string }
                              family:      { type: string, enum: [ipv4, ipv6] }
                              rootPrefix:  { type: integer, minimum: 0, maximum: 128 }
                              rootCidr:    { type: string }
                              operations:
                                type: array
                                items:
                                  oneOf:
                                    - type: object
                                      required: [op, cidr, into]
                                      properties:
                                        op:   { type: string, enum: [split] }
                                        cidr: { type: string }
                                        into: { type: integer, enum: [2, 4, 8, 16] }
                                    - type: object
                                      required: [op, cidr, name]
                                      properties:
                                        op:    { type: string, enum: [rename] }
                                        cidr:  { type: string }
                                        name:  { type: string }
                                        notes: { type: string }
        "401":
          description: Missing or invalid Bearer token
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Preset not found
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
            Retry-After:           { $ref: "#/components/headers/RetryAfter" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /admin/keys:
    get:
      operationId: listAdminKeys
      tags: [Admin]
      security:
        - adminBasic: []
      summary: List API keys (self-hoster admin)
      description: |
        Lists all API keys with their public prefix, status, and timestamps.
        Token hashes are never returned.

        Authentication: HTTP Basic Auth using `$admin_user` / `$admin_pass_hash`.
        Available only when `$admin_ui_enabled = true`. Self-hosters should
        front this endpoint with TLS termination at the reverse proxy.
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [keys]
                        properties:
                          keys:
                            type: array
                            items:
                              type: object
                              required: [id, name, prefix, created_at]
                              properties:
                                id:             { type: integer }
                                name:           { type: string }
                                prefix:         { type: string, description: "First 8 hex chars of the token (non-secret)." }
                                created_at:     { type: integer, description: "UNIX epoch seconds." }
                                last_used_at:   { type: [integer, "null"] }
                                revoked_at:     { type: [integer, "null"] }
                                rate_limit_rpm: { type: [integer, "null"], description: "Per-key RPM override (v3.0.0+, #312). null = inherit global; 0 = unlimited." }
        "401":
          description: Missing or invalid admin credentials
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Admin UI is disabled on this server
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "503":
          description: Admin enabled but credentials not configured
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    post:
      operationId: createAdminKey
      tags: [Admin]
      security:
        - adminBasic: []
      summary: Mint a new API key
      description: |
        Creates a new API key. The plaintext token is returned in the
        response exactly once — it is bcrypt-hashed in storage and cannot
        be retrieved again. Authentication: HTTP Basic Auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                  example: "production"
                rate_limit_rpm:
                  description: "Per-key RPM override (v3.0.0+, #312). Omit or null to inherit the global default. 0 = unlimited."
                  oneOf:
                    - type: integer
                      minimum: 0
                    - type: "null"
      responses:
        "201":
          description: Key created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id, token, prefix, name, created_at]
                        properties:
                          id:             { type: integer, example: 1 }
                          token:          { type: string,  example: "sk_live_a1b2c3d4e5f6...", description: "Returned exactly once — store securely." }
                          prefix:         { type: string,  example: "a1b2c3d4" }
                          name:           { type: string,  example: "production" }
                          created_at:     { type: integer, example: 1714742400 }
                          rate_limit_rpm: { type: [integer, "null"], description: "Echo of the per-key RPM override, if set." }
        "400":
          description: Missing or oversized name
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401":
          description: Missing or invalid admin credentials
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Admin UI is disabled on this server
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "503":
          description: Admin enabled but credentials not configured
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /admin/keys/{id}/rate-limit:
    patch:
      operationId: setAdminKeyRateLimit
      tags: [Admin]
      security:
        - adminBasic: []
      summary: Set or clear a per-key rate-limit override (v3.0.0+, #312)
      description: |
        Updates the `rate_limit_rpm` column on a single API key. Lookup
        order in `api_rate_limit()` is: static `$api_rate_limit_tokens`
        override → SQLite per-key override → global `$api_rate_limit_rpm`.
        Authentication: HTTP Basic Auth.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rate_limit_rpm]
              properties:
                rate_limit_rpm:
                  description: "Pass null to clear the override (key inherits the global default). 0 = unlimited."
                  oneOf:
                    - type: integer
                      minimum: 0
                    - type: "null"
      responses:
        "200":
          description: Override updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id, rate_limit_rpm]
                        properties:
                          id:             { type: integer }
                          rate_limit_rpm: { type: [integer, "null"] }
        "400":
          description: rate_limit_rpm must be null or a non-negative integer
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401":
          description: Missing or invalid admin credentials
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Key not found, revoked, or RPM unchanged
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /admin/keys/{id}:
    delete:
      operationId: revokeAdminKey
      tags: [Admin]
      security:
        - adminBasic: []
      summary: Revoke an API key
      description: |
        Marks the named key as revoked. Revocation is permanent — issue a
        new key to replace it. Authentication: HTTP Basic Auth.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Key revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id, revoked]
                        properties:
                          id:      { type: integer }
                          revoked: { type: boolean, enum: [true] }
        "401":
          description: Missing or invalid admin credentials
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Key not found or already revoked
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "503":
          description: Admin enabled but credentials not configured
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }