  /tree:
    post:
      operationId: buildSubnetTree
      tags: [Tree]
      summary: Build a subnet allocation tree from a parent CIDR and child allocations
      description: |
        Accepts a parent CIDR and an array of allocated child CIDRs and returns a
        containment tree showing how the children nest within the parent, including
        unallocated gap CIDRs between allocated blocks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent, children]
              properties:
                parent:
                  type: string
                  description: Parent IPv4 CIDR
                  example: "10.0.0.0/24"
                children:
                  type: array
                  description: Allocated child CIDRs (must all be contained within parent)
                  maxItems: 100
                  items: { type: string }
                  example: ["10.0.0.0/26", "10.0.0.128/26"]
      responses:
        "200":
          description: Subnet allocation tree
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [tree]
                        properties:
                          tree:
                            type: object
                            description: Root tree node
                            required: [cidr, allocated, children]
                            properties:
                              cidr:      { type: string }
                              allocated: { type: boolean }
                              children:
                                type: array
                                items: { type: object }
                              gaps:
                                type: array
                                description: Unallocated CIDR blocks within this node
                                items: { type: string }
              example:
                ok: true
                data:
                  tree:
                    cidr: "10.0.0.0/24"
                    allocated: false
                    children:
                      - cidr: "10.0.0.0/26"
                        allocated: true
                        children: []
                      - cidr: "10.0.0.64/26"
                        allocated: false
                        children: []
                      - cidr: "10.0.0.128/26"
                        allocated: true
                        children: []
                      - cidr: "10.0.0.192/26"
                        allocated: false
                        children: []
        "400":
          description: Invalid CIDRs or children outside parent
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401":
          description: Missing or invalid Bearer token
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Endpoint disabled by $api_allowed_endpoints configuration
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
            Retry-After:           { $ref: "#/components/headers/RetryAfter" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /wildcard:
    post:
      operationId: convertWildcard
      tags: [Wildcard]
      summary: Convert between Cisco-style wildcard masks and CIDR prefixes
      description: |
        Bidirectional converter. If the `value` contains a dot it is treated as
        a wildcard mask (e.g. `0.0.0.255`) and converted to its CIDR prefix.
        Otherwise it is treated as a CIDR prefix (e.g. `/24` or `24`) and
        converted to its wildcard mask. Non-contiguous wildcard masks are
        rejected with HTTP 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  description: Either a CIDR prefix ("/24" or "24") or a wildcard mask ("0.0.0.255")
                  example: "/24"
      responses:
        "200":
          description: Wildcard / CIDR pair
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [input, cidr, wildcard]
                        properties:
                          input:    { type: string }
                          cidr:     { type: string, example: "/24" }
                          wildcard: { type: string, example: "0.0.0.255" }
              example:
                ok: true
                data:
                  input: "/24"
                  cidr: "/24"
                  wildcard: "0.0.0.255"
        "400": { description: "Missing value, malformed input, or non-contiguous wildcard", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "401":
          description: Missing or invalid Bearer token
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Endpoint disabled by $api_allowed_endpoints configuration
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
            Retry-After:           { $ref: "#/components/headers/RetryAfter" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /lookup:
    post:
      operationId: lookupIps
      tags: [Lookup]
      summary: Inverse subnet lookup — find which CIDRs contain each IP
      description: |
        For each IP in `ips`, returns every CIDR from `cidrs` that contains it
        and identifies the deepest (longest-prefix) match. IPv4 and IPv6 inputs
        may be mixed; a CIDR only matches an IP of the same family. Result rows
        are returned in the same order as the input `ips` array.

        Defaults are 100 CIDRs and 1000 IPs per request; operators may raise
        them up to hard ceilings of 1000 and 10000 via
        `$lookup_max_cidrs` / `$lookup_max_ips`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cidrs, ips]
              properties:
                cidrs:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  description: CIDR networks to test against (IPv4 and/or IPv6). Default cap 100; hard ceiling 1000 (operator-tunable via `$lookup_max_cidrs`).
                  items: { type: string, example: "10.0.0.0/8" }
                ips:
                  type: array
                  minItems: 1
                  maxItems: 10000
                  description: IP addresses to look up. Default cap 1000; hard ceiling 10000 (operator-tunable via `$lookup_max_ips`).
                  items: { type: string, example: "10.1.2.3" }
            example:
              cidrs: ["10.0.0.0/8", "10.1.0.0/16", "2001:db8::/32"]
              ips:   ["10.1.2.3", "8.8.8.8", "2001:db8::1"]
      responses:
        "200":
          description: Lookup results, one row per IP
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [results]
                        properties:
                          results:
                            type: array
                            items:
                              type: object
                              required: [ip, matches, deepest]
                              properties:
                                ip:      { type: string, example: "10.1.2.3" }
                                matches:
                                  type: array
                                  items: { type: string }
                                  description: Every CIDR that contains the IP.
                                deepest:
                                  type: [string, "null"]
                                  description: Longest-prefix match, or null if no match.
              example:
                ok: true
                data:
                  results:
                    - ip: "10.1.2.3"
                      matches: ["10.0.0.0/8", "10.1.0.0/16"]
                      deepest: "10.1.0.0/16"
                    - ip: "8.8.8.8"
                      matches: []
                      deepest: null
                    - ip: "2001:db8::1"
                      matches: ["2001:db8::/32"]
                      deepest: "2001:db8::/32"
        "400":
          description: "Missing/invalid input or out-of-range cap"
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401":
          description: Missing or invalid Bearer token
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Endpoint disabled by $api_allowed_endpoints configuration
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
            Retry-After:           { $ref: "#/components/headers/RetryAfter" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /diff:
    post:
      operationId: subnetDiff
      tags: [Diff]
      summary: Compare two CIDR lists and report added / removed / changed / unchanged
      description: |
        Computes a structural diff between a "before" and an "after" list of
        CIDRs. Each input CIDR is normalised to canonical form before comparison
        (host bits zeroed; IPv6 lowercased and compressed). Result categories:

        - `unchanged`: CIDRs present in both lists with the same prefix length.
        - `removed`:   CIDRs only in `before` (sorted; IPv4 first, then IPv6).
        - `added`:     CIDRs only in `after`  (sorted; IPv4 first, then IPv6).
        - `changed`:   pairs where the network address matches but the prefix
                       length differs (e.g. `10.0.0.0/24` → `10.0.0.0/23`).

        Cap: max 1000 entries per list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [before, after]
              properties:
                before:
                  type: array
                  maxItems: 1000
                  description: CIDR list representing the prior state.
                  items: { type: string, example: "10.0.0.0/24" }
                after:
                  type: array
                  maxItems: 1000
                  description: CIDR list representing the desired state.
                  items: { type: string, example: "10.0.0.0/23" }
            example:
              before: ["10.0.0.0/24", "10.0.1.0/24", "192.168.0.0/24"]
              after:  ["10.0.0.0/23", "10.0.1.0/24", "192.168.1.0/24"]
      responses:
        "200":
          description: Diff result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [added, removed, unchanged, changed]
                        properties:
                          added:
                            type: array
                            items: { type: string }
                          removed:
                            type: array
                            items: { type: string }
                          unchanged:
                            type: array
                            items: { type: string }
                          changed:
                            type: array
                            items:
                              type: object
                              required: [from, to, reason]
                              properties:
                                from:   { type: string, example: "10.0.0.0/24" }
                                to:     { type: string, example: "10.0.0.0/23" }
                                reason: { type: string, example: "prefix changed /24 → /23" }
              example:
                ok: true
                data:
                  added:     ["192.168.1.0/24"]
                  removed:   ["192.168.0.0/24"]
                  unchanged: ["10.0.1.0/24"]
                  changed:
                    - from: "10.0.0.0/24"
                      to:   "10.0.0.0/23"
                      reason: "prefix changed /24 → /23"
        "400": { description: "Missing field, invalid CIDR, or list too large", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "401":
          description: Missing or invalid Bearer token
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Endpoint disabled by $api_allowed_endpoints configuration
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
            Retry-After:           { $ref: "#/components/headers/RetryAfter" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /changelog:
