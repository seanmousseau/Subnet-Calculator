  /multicast6:
    post:
      operationId: multicast6Decode
      tags: [Multicast6]
      summary: Decode an IPv6 multicast address (RFC 4291 §2.7)
      description: |
        Front-door decoder for the v3.6.0 IPv6 multicast tools. Decodes any
        FF00::/8 address into:

        - `scope` (1..15) and `scope_name` (`interface-local`, `link-local`,
          `admin-local`, `site-local`, `organization-local`, `global`,
          `reserved`) per RFC 4291 §2.7 + RFC 7346.
        - 4-bit `flags` field (0RPT) with booleans `transient`, `prefix_based`
          (RFC 3306), `embedded_rp` (RFC 3956).
        - `scheme` hint: `well-known`, `transient`, `ssm`, `embedded-rp`,
          or `reserved`.
        - 112-bit `group_id` as a 28-character hex string.
        - `well_known` lookup against the in-tree registry of named groups
          (FF02::1, FF02::2, FF02::5/6 OSPF, FF02::9 RIP, FF02::d All-PIM,
          FF02::16 MLDv2, FF05::101 NTP, plus the FF02::1:FF**:**** Solicited-Node
          family). Returns `null` when not matched.
        - `detail_route` deep-link to the per-scheme tool drawer (`/ipv6/ssm`
          for prefix-based / SSM groups; `/ipv6/embedded-rp` for embedded-RP);
          `null` otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ipv6]
              properties:
                ipv6:
                  type: string
                  description: An IPv6 multicast address literal (must be in FF00::/8).
                  example: "FF02::1"
            examples:
              all-nodes:
                summary: All Nodes (link-local well-known)
                value: { ipv6: "FF02::1" }
              solicited-node:
                summary: Solicited-Node (RFC 4291)
                value: { ipv6: "FF02::1:FF12:3456" }
              ssm:
                summary: SSM (prefix-based, scope global)
                value: { ipv6: "FF3E::1234:5678" }
              embedded-rp:
                summary: Embedded-RP (RFC 3956)
                value: { ipv6: "FF7E:140:2001:db8:cafe::1234" }
      responses:
        "200":
          description: Decoded multicast address
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - input
                          - address
                          - scope
                          - scope_name
                          - flags
                          - transient
                          - prefix_based
                          - embedded_rp
                          - group_id
                          - scheme
                          - detail_route
                          - well_known
                        properties:
                          input:
                            type: string
                            example: "FF02::1"
                          address:
                            type: string
                            description: Canonical compressed lowercase form of the input.
                            example: "ff02::1"
                          scope:
                            type: integer
                            minimum: 0
                            maximum: 15
                            example: 2
                          scope_name:
                            type: string
                            enum: [interface-local, link-local, admin-local, site-local, organization-local, global, reserved]
                            example: link-local
                          flags:
                            type: integer
                            minimum: 0
                            maximum: 15
                            example: 0
                          transient:
                            type: boolean
                            example: false
                          prefix_based:
                            type: boolean
                            example: false
                          embedded_rp:
                            type: boolean
                            example: false
                          group_id:
                            type: string
                            description: 112-bit group ID as a 28-character hex string.
                            example: "00000000000000000000000000000001"
                          scheme:
                            type: string
                            enum: [well-known, transient, ssm, embedded-rp, reserved]
                            example: well-known
                          detail_route:
                            type: string
                            nullable: true
                            description: Relative URL of the per-scheme tool drawer; null when not applicable.
                            example: null
                          well_known:
                            type: object
                            nullable: true
                            description: Registry entry when the address matches a well-known group; null otherwise.
                            required: [name, rfc]
                            properties:
                              name: { type: string, example: "All Nodes Address" }
                              rfc:  { type: string, example: "RFC 4291" }
              example:
                ok: true
                data:
                  input: "FF02::1"
                  address: "ff02::1"
                  scope: 2
                  scope_name: "link-local"
                  flags: 0
                  transient: false
                  prefix_based: false
                  embedded_rp: false
                  group_id: "00000000000000000000000000000001"
                  scheme: "well-known"
                  detail_route: null
                  well_known: { name: "All Nodes Address", rfc: "RFC 4291" }
        "400":
          description: Missing or non-multicast IPv6 input
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401":
          description: Missing or invalid Bearer token
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Endpoint disabled by $api_allowed_endpoints configuration
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
            Retry-After:           { $ref: "#/components/headers/RetryAfter" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /bulk:
    post:
      operationId: bulkCalculate
      tags: [Bulk]
      summary: Calculate multiple subnets in a single request
      description: |
        Two request modes are supported, selected by the body shape:

        - **Legacy CIDR mode** — body contains `cidrs[]`. Resolves each CIDR
          via /ipv4 or /ipv6 logic. Per-item envelope: `{input, ok, data?, error?}`.
        - **Multi-op mode (v3.4.0+v3.5.0)** — body contains `items[]`.
          Each item has its own `op` slug and `params` payload. Supported
          ops: `range6`, `supernet6`, `zone-id`, `derive`, `slaac-privacy`,
          `rdns6`, `mapped6` (v3.4.0); `embedded-v4`, `6to4`, `teredo`,
          `isatap`, `6rd`, `nat64`, `prefix-plan6`, `nibble6`, `rfc3531`
          (v3.5.0). Per-item envelope: `{op, ok, error?, ...result}` where
          `...result` matches the standalone endpoint's success body.

        Up to 50 entries per request. Individual failures do not abort the
        request — each item carries its own ok/error status. IPv6 ops
        require the PHP GMP extension.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [cidrs]
                  properties:
                    cidrs:
                      type: array
                      minItems: 1
                      maxItems: 50
                      items: { type: string }
                      example: ["10.0.0.0/24", "2001:db8::/32"]
                    type:
                      type: string
                      enum: [auto, ipv4, ipv6]
                      default: auto
                      description: Force all items to a specific IP version. `auto` detects per-item.
                - type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      minItems: 1
                      maxItems: 50
                      items:
                        type: object
                        required: [op, params]
                        properties:
                          op:
                            type: string
                            enum:
                              - range6
                              - supernet6
                              - zone-id
                              - derive
                              - slaac-privacy
                              - rdns6
                              - mapped6
                              - embedded-v4
                              - 6to4
                              - teredo
                              - isatap
                              - 6rd
                              - nat64
                              - prefix-plan6
                              - nibble6
                              - rfc3531
                          params:
                            type: object
                            description: Per-op parameters; shape matches the corresponding standalone endpoint's request body.
                  example:
                    items:
                      - op: range6
                        params: { start: "2001:db8::", end: "2001:db8::ff" }
                      - op: supernet6
                        params: { action: find, cidrs: ["2001:db8:0::/48", "2001:db8:1::/48"] }
                      - op: zone-id
                        params: { input: "fe80::1%eth0" }
                      - op: derive
                        params: { mac: "00:11:22:33:44:55" }
                      - op: slaac-privacy
                        params: { prefix: "2001:db8::/64", seed: "deadbeefcafef00d" }
                      - op: rdns6
                        params: { address: "2001:db8::1", prefix: 64 }
                      - op: mapped6
                        params: { input: "192.0.2.1" }
                      - op: embedded-v4
                        params: { input: "::ffff:192.0.2.1" }
                      - op: 6to4
                        params: { mode: "encode", ipv4: "192.0.2.1" }
                      - op: teredo
                        params: { mode: "decode", ipv6: "2001:0:4136:e378:8000:63bf:3fff:fdd2" }
                      - op: isatap
                        params: { mode: "encode", ipv4: "192.0.2.1" }
                      - op: 6rd
                        params: { mode: "encode", sp_ipv6_prefix: "2001:db8::/32", sp_ipv4_mask_len: 0, customer_ipv4: "192.0.2.1" }
                      - op: nat64
                        params: { mode: "encode", ipv4: "192.0.2.1", prefix_length: 96 }
                      - op: prefix-plan6
                        params: { parent_prefix: "2001:db8::/48", child_length: 56, count: 4 }
                      - op: nibble6
                        params: { prefix: "2001:db8::/49" }
                      - op: rfc3531
                        params: { parent_prefix: "2001:db8::/48", reservation_bits: 4, strategy: "centermost" }
      responses:
        "200":
          description: Per-item calculation results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [results]
                        properties:
                          results:
                            type: array
                            description: |
                              In legacy `cidrs[]` mode, each entry is `{input, ok, data?, error?}`.
                              In multi-op `items[]` mode, each entry is
                              `{op, ok, error?, ...result}` where `...result` matches the
                              corresponding standalone endpoint's success body.
                            items:
                              type: object
                              properties:
                                input: { type: string, description: "Present in legacy cidrs[] mode." }
                                op:    { type: string, description: "Present in multi-op items[] mode." }
                                ok:    { type: boolean }
                                data:  { description: "Legacy cidrs[] mode — present when ok is true. Shape matches /ipv4 or /ipv6 response data." }
                                error: { type: string, description: "Present when ok is false." }
              example:
                ok: true
                data:
                  results:
                    - input: "10.0.0.0/24"
                      ok: true
                      data:
                        network_cidr: "10.0.0.0/24"
                        broadcast: "10.0.0.255"
                        netmask: "255.255.255.0"
                        netmask_cidr: "/24"
                        wildcard: "0.0.0.255"
                        host_min: "10.0.0.1"
                        host_max: "10.0.0.254"
                        usable_hosts: 254
                        total_ips: 256
                        ip_type: "Private"
                    - input: "2001:db8::/32"
                      ok: true
                      data:
                        network_cidr: "2001:db8::/32"
                        prefix: "/32"
                        first_addr: "2001:db8::"
                        last_addr: "2001:db8:ffff:ffff:ffff:ffff:ffff:ffff"
                        total_addresses: "79228162514264337593543950336"
        "400":
          description: Invalid request
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401":
          description: Missing or invalid Bearer token
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Endpoint disabled by $api_allowed_endpoints configuration
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
            Retry-After:           { $ref: "#/components/headers/RetryAfter" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /range/ipv4:
    post:
      operationId: rangeToIPv4CIDRs
      tags: [Range]
      summary: Convert an IPv4 address range to its minimal covering CIDR list
      description: |
        Accepts a start IP and end IP (both inclusive) and returns the minimal list of
        CIDRs that exactly covers the range using a greedy largest-aligned block algorithm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start, end]
              properties:
                start:
                  type: string
                  description: Start IPv4 address (inclusive)
                  example: "10.0.0.0"
                end:
                  type: string
                  description: End IPv4 address (inclusive)
                  example: "10.0.0.255"
      responses:
        "200":
          description: List of covering CIDRs
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [cidrs, count, total_addresses, truncated, cap]
                        properties:
                          cidrs:
                            type: array
                            items: { type: string }
                            example: ["10.0.0.0/24"]
                          count:
                            type: integer
                            description: Number of CIDR blocks emitted (v3.3.0)
                            example: 1
                          total_addresses:
                            type: integer
                            description: Inclusive count of addresses in the range (v3.3.0)
                            example: 256
                          truncated:
                            type: boolean
                            description: |
                              True when the configured `$range_max_cidrs` cap was
                              hit and the result was cut short. Default cap 256;
                              configurable via `$range_max_cidrs` in `config.php`.
                              Added in v3.3.0 — pre-v3.3.0 responses omitted this field.
                            example: false
                          cap:
                            type: integer
                            description: Effective output-CIDR cap for this request (v3.3.0)
                            example: 256
              example:
                ok: true
                data:
                  cidrs:
                    - "10.0.0.0/24"
                  count: 1
                  total_addresses: 256
                  truncated: false
                  cap: 256
        "400":
          description: Invalid IPs or end < start
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401":
          description: Missing or invalid Bearer token
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Endpoint disabled by $api_allowed_endpoints configuration
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
            Retry-After:           { $ref: "#/components/headers/RetryAfter" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /range6:
    post:
      operationId: rangeToIPv6CIDRs
      tags: [Range]
      summary: Convert an IPv6 address range to its minimal covering CIDR list
      description: |
        Accepts a start and end IPv6 address (both inclusive) and returns the
        minimal list of CIDRs that exactly covers the range using a greedy
        largest-aligned block algorithm. Pure GMP — no overflow on /128-wide
        ranges. Added in v3.3.0.

        The output cap is configurable via `$range_max_cidrs` in `config.php`
        (default 256). When the cap is hit the response sets `truncated: true`
        and returns the partial CIDR list — clients should always check this
        flag before assuming the list is exhaustive.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Range6Request" }
      responses:
        "200":
          description: List of covering CIDRs
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [cidrs, count, total_addresses, truncated, cap]
                        properties:
                          cidrs:
                            type: array
                            items: { type: string }
                            example: ["2001:db8::/112"]
                          count:
                            type: integer
                            example: 1
                          total_addresses:
                            description: |
                              Inclusive address count. PHP integer when small;
                              `2^N` string when the value overflows a 64-bit int
                              (e.g. a /48 range covers `2^80` addresses).
                            oneOf:
                              - type: integer
                              - type: string
                                pattern: "^2\\^[0-9]{1,3}$"
                            example: 65536
                          truncated:
                            type: boolean
                            example: false
                          cap:
                            type: integer
                            example: 256
              example:
                ok: true
                data:
                  cidrs:
                    - "2001:db8::/112"
                  count: 1
                  total_addresses: 65536
                  truncated: false
                  cap: 256
        "400":
          description: Invalid IPv6 addresses, IPv4 input, or end < start
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401":
          description: Missing or invalid Bearer token
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Endpoint disabled by $api_allowed_endpoints configuration
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
