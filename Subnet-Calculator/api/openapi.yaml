openapi: 3.1.0
info:
  title: Subnet Calculator API
  version: "2.12.1"
  description: |
    JSON REST API for IPv4/IPv6 subnet calculation, VLSM allocation,
    overlap detection, subnet splitting, route summarisation, ULA prefix
    generation, and VLSM session persistence.

    ## Rate-limit response headers

    When `$api_rate_limit_rpm` is greater than zero on the server, every
    response (including 4xx errors) carries the following headers so that
    generated clients can surface remaining quota:

    - `X-RateLimit-Limit:` requests-per-minute ceiling for this client.
    - `X-RateLimit-Remaining:` requests left in the current 60-second window.
    - `X-RateLimit-Reset:` UNIX epoch seconds when the window rolls over.
    - `Retry-After:` seconds until the window resets — only on `429` responses.

    Header definitions live under `components.headers` and are referenced
    explicitly on every documented response.
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only
  contact:
    name: Sean Mousseau
    url: https://github.com/seanmousseau/Subnet-Calculator

externalDocs:
  description: Subnet Calculator documentation
  url: https://docs.subnetcalculator.app/api/

servers:
  - url: /api/v1
    description: |
      Relative to the app installation root.
      Operators may restrict available endpoints via the `$api_allowed_endpoints`
      configuration variable (see `config.php.example`). If an endpoint is disabled,
      requests to it return HTTP 404 even when the server is otherwise reachable.
      The meta endpoint (GET /) always remains accessible regardless of this setting.

security: []   # Override per-operation when $api_tokens is configured

tags:
  - name: Meta
    description: API metadata and discovery
  - name: IPv4
    description: IPv4 subnet calculation
  - name: IPv6
    description: IPv6 subnet calculation
  - name: VLSM
    description: Variable Length Subnet Masking allocation
  - name: Overlap
    description: Subnet overlap detection
  - name: Split
    description: Subnet splitting
  - name: Supernet
    description: Route summarisation and supernet calculation
  - name: ULA
    description: IPv6 Unique Local Address generation
  - name: Sessions
    description: VLSM session persistence
  - name: RDNS
    description: Reverse-DNS zone generation
  - name: Mapped6
    description: IPv4-mapped IPv6 and NAT64 conversion
  - name: EmbeddedV4
    description: IPv6 embedded-IPv4 detector (front door for v3.5.0 transition tools)
  - name: SixToFour
    description: 6to4 address tool (RFC 3056) — bidirectional IPv4 ↔ 2002::/16 translation
  - name: Teredo
    description: Teredo address decoder (RFC 4380) — bidirectional decoding/encoding of 2001:0::/32 addresses
  - name: Isatap
    description: ISATAP interface-ID helper (RFC 5214) — bidirectional encoding/decoding of the 64-bit ISATAP IID
  - name: SixRd
    description: 6rd address tool (RFC 5969) — service-provider-configured IPv4 ↔ delegated IPv6 prefix translation
  - name: Nat64
    description: NAT64 / DNS64 helper (RFC 6052 / 6147) — prefix-length-aware IPv4 ↔ NAT64 IPv6 translation and DNS64 AAAA synthesis
  - name: PrefixPlan6
    description: IPv6 prefix-delegation planner — slice a parent prefix into nibble-aligned child prefixes (operator math, not detection)
  - name: Nibble6
    description: IPv6 nibble-boundary helper — surface the nibble-aligned neighbours (above and below) of any IPv6 prefix
  - name: Rfc3531
    description: RFC 3531 sparse-allocation guidance — centermost / leftmost / rightmost bit-reservation strategy for growth-friendly prefix assignment
  - name: Multicast6
    description: IPv6 multicast scope decoder (RFC 4291 §2.7) — front door for the v3.6.0 multicast tools (scope, flags, scheme, well-known group lookup, deep-link to SSM and embedded-RP)
  - name: Bulk
    description: Batch subnet calculation
  - name: Range
    description: IP address range to CIDR conversion
  - name: Tree
    description: Subnet allocation tree
  - name: TreePresets
    description: Subnet tree-editor preset library (v3.1.0, #323)
  - name: Wildcard
    description: Wildcard mask ↔ CIDR conversion
  - name: Lookup
    description: Inverse subnet lookup (find which CIDRs contain each IP)
  - name: Diff
    description: Subnet aggregation diff (compare two CIDR lists)
  - name: Changelog
    description: API changelog
  - name: Schemas
    description: Published JSON-Schema documents for persisted payload formats
  - name: Admin
    description: |
      Self-hoster admin endpoints for API key management. Gated by
      `$admin_ui_enabled = true` and HTTP Basic Auth (admin user/password).
      Available only on the same origin as the web admin UI at `/admin/`.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    # Used only on the operator self-host /admin/keys endpoints. The admin
    # surface is gated by $admin_ui_enabled and is intended to sit behind
    # operator-managed TLS at the reverse proxy. Documented here so generated
    # clients can discover the auth contract; the public API continues to
    # use bearerAuth exclusively. nosemgrep: yaml.openapi.security.basic-authentication
    adminBasic:
      type: http  # nosemgrep
      scheme: basic  # nosemgrep

  headers:
    XRateLimitLimit:
      description: Requests-per-minute ceiling for this client. Present whenever rate limiting is active.
      schema:
        type: integer
        example: 60
    XRateLimitRemaining:
      description: Requests left in the current 60-second window. Present whenever rate limiting is active.
      schema:
        type: integer
        example: 59
    XRateLimitReset:
      description: UNIX epoch seconds when the rate-limit window rolls over. Present whenever rate limiting is active.
      schema:
        type: integer
        example: 1714742460
    RetryAfter:
      description: Seconds until the rate-limit window resets. Only sent on `429` responses.
      schema:
        type: integer
        example: 60

  schemas:
    OkEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object

    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string

    Ipv4Result:
      type: object
      required:
        - network_cidr
        - broadcast
        - netmask
        - netmask_cidr
        - wildcard
        - host_min
        - host_max
        - usable_hosts
        - total_ips
      properties:
        network_cidr:    { type: string,  example: "10.0.0.0/24" }
        broadcast:       { type: string,  example: "10.0.0.255" }
        netmask:         { type: string,  example: "255.255.255.0" }
        netmask_cidr:    { type: string,  example: "/24" }
        wildcard:        { type: string,  example: "0.0.0.255" }
        host_min:        { type: string,  example: "10.0.0.1" }
        host_max:        { type: string,  example: "10.0.0.254" }
        usable_hosts:    { type: integer, example: 254 }
        total_ips:       { type: integer, example: 256 }
        ip_type:         { type: string,  example: "Private" }
        reverse_dns:     { type: string,  example: "0.0.10.in-addr.arpa" }
        network_hex:     { type: string,  example: "0A.00.00.00", description: "Network address in dotted-hex notation (e.g. C0.A8.01.00)" }
        network_decimal: { type: integer, example: 167772160,    description: "Network address as unsigned 32-bit decimal integer" }

    Ipv6Result:
      type: object
      required: [network_cidr, prefix, first_addr, last_addr]
      properties:
        network_cidr:       { type: string, example: "2001:db8::/32" }
        prefix:             { type: string, example: "/32" }
        first_addr:         { type: string, example: "2001:db8::" }
        last_addr:          { type: string, example: "2001:db8:ffff:ffff:ffff:ffff:ffff:ffff" }
        total_addresses:    { type: string, example: "79228162514264337593543950336" }
        address_expanded:   { type: string, example: "2001:0db8:0000:0000:0000:0000:0000:0000", description: "Full 128-bit address in 8 colon-separated 4-hex groups" }
        address_compressed: { type: string, example: "2001:db8::", description: "Address in compressed RFC 5952 notation" }

    VlsmAllocation:
      type: object
      required: [name, hosts_needed, subnet, host_min, host_max, usable, waste]
      properties:
        name:         { type: string, example: "LAN" }
        hosts_needed: { type: integer, example: 50 }
        subnet:       { type: string, example: "10.0.0.0/26" }
        host_min:     { type: string, example: "10.0.0.1" }
        host_max:     { type: string, example: "10.0.0.62" }
        usable:       { type: integer, example: 62 }
        waste:        { type: integer, example: 12 }

    Vlsm6Allocation:
      type: object
      required: [name, hosts_needed, subnet, usable]
      properties:
        name:         { type: string, example: "site-a" }
        hosts_needed:
          oneOf:
            - type: integer
            - type: string
          description: Echo of the input host count (integer or "2^N" string).
          example: 256
        subnet:       { type: string, example: "2001:db8::/120", description: "RFC 5952 compressed IPv6 CIDR." }
        usable:
          oneOf:
            - type: integer
            - type: string
          description: Usable address count; "2^N" string when the value would overflow a 32-bit integer.
          example: 256

    SplitResult:
      type: object
      required: [network, split_prefix, total, showing, subnets]
      properties:
        network:       { type: string, example: "10.0.0.0/24" }
        split_prefix:  { type: string, example: "/26" }
        total:
          oneOf:
            - type: integer
            - type: string
          description: Total subnets; string like "2^N" when too large to count.
          example: 4
        showing:       { type: integer, example: 4 }
        subnets:
          type: array
          items: { type: string }

    UlaResult:
      type: object
      required: [prefix, global_id, example_64s, available_64s]
      properties:
        prefix:        { type: string, example: "fd1a:2b3c:4d5e::/48" }
        global_id:     { type: string, example: "1a2b3c4d5e" }
        example_64s:
          type: array
          items: { type: string }
          example: ["fd1a:2b3c:4d5e:0000::/64", "fd1a:2b3c:4d5e:0001::/64"]
        available_64s: { type: integer, example: 65536 }

    # ── v3.3.0 IPv6 endpoint request bodies (extracted per CR feedback PR #369) ──
    Supernet6Request:
      type: object
      required: [cidrs]
      properties:
        action:
          type: string
          enum: [find, summarise]
          default: find
          description: "`find` returns the smallest enclosing IPv6 supernet; `summarise` reduces to minimal covering IPv6 prefixes."
        cidrs:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string }
          example: ["2001:db8::/64", "2001:db8:0:1::/64"]

    ZoneIdRequest:
      type: object
      required: [input]
      properties:
        input:
          type: string
          description: IPv6 address with optional `%zone` suffix.
          example: "fe80::1%eth0"

    DeriveRequest:
      type: object
      required: [mac]
      properties:
        mac:
          type: string
          description: 48-bit MAC address in any common format.
          example: "00:24:b9:7e:ab:cd"

    SlaacPrivacyRequest:
      type: object
      required: [prefix]
      properties:
        prefix:
          type: string
          description: IPv6 /64 prefix; non-/64 prefixes are rejected.
          example: "2001:db8:1:2::/64"
        seed:
          type: string
          description: Optional 16 hexadecimal characters for reproducible output.
          pattern: "^[0-9a-fA-F]{16}$"
          example: "a8d3f4e10c529837"

    Range6Request:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          description: Start IPv6 address (inclusive)
          example: "2001:db8::"
        end:
          type: string
          description: End IPv6 address (inclusive)
          example: "2001:db8::ffff"

paths:
  /:
    get:
      operationId: meta
      tags: [Meta]
      summary: API metadata
      description: Returns API version and list of available endpoints.
      responses:
        "200":
          description: Metadata
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          version:   { type: string }
                          endpoints: { type: array, items: { type: string } }
              example:
                ok: true
                data:
                  version: "1"
                  endpoints:
                    - "POST /api/v1/ipv4"
                    - "POST /api/v1/ipv6"
                    - "POST /api/v1/vlsm"
                    - "POST /api/v1/overlap"
                    - "POST /api/v1/split/ipv4"
                    - "POST /api/v1/split/ipv6"
                    - "POST /api/v1/supernet"
                    - "POST /api/v1/supernet6"
                    - "POST /api/v1/zone-id"
                    - "POST /api/v1/derive"
                    - "POST /api/v1/slaac-privacy"
                    - "POST /api/v1/ula"
                    - "POST /api/v1/rdns"
                    - "POST /api/v1/rdns6"
                    - "POST /api/v1/mapped6"
                    - "POST /api/v1/embedded-v4"
                    - "POST /api/v1/6to4"
                    - "POST /api/v1/teredo"
                    - "POST /api/v1/isatap"
                    - "POST /api/v1/6rd"
                    - "POST /api/v1/nat64"
                    - "POST /api/v1/multicast6"
                    - "POST /api/v1/bulk"
                    - "POST /api/v1/range/ipv4"
                    - "POST /api/v1/range6"
                    - "POST /api/v1/tree"
                    - "POST /api/v1/sessions"
                    - "GET  /api/v1/sessions/{id}"
                    - "GET  /api/v1/changelog"

  /ipv4:
    post:
      operationId: calcIpv4
      tags: [IPv4]
      summary: IPv4 subnet calculation
      description: >
        Calculate IPv4 subnet details including network address, broadcast,
        netmask, wildcard mask, host range, usable host count, address type,
        and reverse-DNS zone from an IP address and optional prefix or mask.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip]
              properties:
                ip:   { type: string, description: "IP address (with or without prefix)", example: "10.0.0.1" }
                mask: { type: string, description: "Prefix length or dotted-decimal mask", example: "24" }
      responses:
        "200":
          description: Subnet details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Ipv4Result" }
              example:
                ok: true
                data:
                  network_cidr: "10.0.0.0/24"
                  broadcast: "10.0.0.255"
                  netmask: "255.255.255.0"
                  netmask_cidr: "/24"
                  wildcard: "0.0.0.255"
                  host_min: "10.0.0.1"
                  host_max: "10.0.0.254"
                  usable_hosts: 254
                  total_ips: 256
                  ip_type: "Private"
                  reverse_dns: "0.0.10.in-addr.arpa"
                  network_hex: "0A.00.00.00"
                  network_decimal: 167772160
        "400":
          description: Invalid input
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401":
          description: Missing or invalid Bearer token
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Endpoint disabled by $api_allowed_endpoints configuration
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
            Retry-After:           { $ref: "#/components/headers/RetryAfter" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /ipv6:
    post:
      operationId: calcIpv6
      tags: [IPv6]
      summary: IPv6 subnet calculation
      description: >
        Calculate IPv6 prefix details including network CIDR, first and last
        address, total address count, expanded and compressed address forms,
        and address type. Requires the PHP GMP extension on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ipv6]
              properties:
                ipv6:   { type: string, example: "2001:db8::1" }
                prefix: { type: string, example: "32" }
      responses:
        "200":
          description: Subnet details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Ipv6Result" }
              example:
                ok: true
                data:
                  network_cidr: "2001:db8::/32"
                  prefix: "/32"
                  first_addr: "2001:db8::"
                  last_addr: "2001:db8:ffff:ffff:ffff:ffff:ffff:ffff"
                  total_addresses: "79228162514264337593543950336"
                  address_expanded: "2001:0db8:0000:0000:0000:0000:0000:0000"
                  address_compressed: "2001:db8::"
        "400":
          description: Invalid input
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401":
          description: Missing or invalid Bearer token
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Endpoint disabled by $api_allowed_endpoints configuration
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
            Retry-After:           { $ref: "#/components/headers/RetryAfter" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /vlsm:
    post:
      operationId: calcVlsm
      tags: [VLSM]
      summary: VLSM subnet allocation
      description: >
        Allocates subnets from a parent network using Variable Length Subnet
        Masking. Requirements are sorted largest-first and packed greedily;
        the response includes each allocation's subnet, host range, usable
        count, and wasted addresses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [network, requirements]
              properties:
                network:
                  type: string
                  example: "10.0.0.0"
                cidr:
                  type: string
                  example: "24"
                requirements:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, hosts]
                    properties:
                      name:  { type: string, example: "LAN" }
                      hosts: { type: integer, minimum: 1, example: 50 }
      responses:
        "200":
          description: VLSM allocations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          allocations:
                            type: array
                            items: { $ref: "#/components/schemas/VlsmAllocation" }
              example:
                ok: true
                data:
                  allocations:
                    - name: "LAN"
                      hosts_needed: 50
                      subnet: "10.0.0.0/26"
                      host_min: "10.0.0.1"
                      host_max: "10.0.0.62"
                      usable: 62
                      waste: 12
                    - name: "DMZ"
                      hosts_needed: 14
                      subnet: "10.0.0.64/28"
                      host_min: "10.0.0.65"
                      host_max: "10.0.0.78"
                      usable: 14
                      waste: 0
        "400":
          description: Invalid input
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401":
          description: Missing or invalid Bearer token
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Endpoint disabled by $api_allowed_endpoints configuration
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            X-RateLimit-Reset:     { $ref: "#/components/headers/XRateLimitReset" }
            Retry-After:           { $ref: "#/components/headers/RetryAfter" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /vlsm6:
    post:
      operationId: calcVlsm6
      tags: [VLSM]
      summary: IPv6 VLSM subnet allocation
      description: >
        Allocates IPv6 subnets from a parent network using Variable Length Subnet
        Masking. Requirements are sorted largest-first and packed greedily.
        Every IPv6 address is usable (no broadcast / network reservation), so
        the smallest prefix /p that satisfies "2^(128-p) >= hosts" is selected
        for each requirement. Host counts may be a positive integer or a
        "2^N" string (e.g. "2^96") for very large IPv6 sizings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [network, requirements]
              properties:
                network:
                  type: string
                  example: "2001:db8::"
                cidr:
                  type: string
                  example: "32"
                  description: "IPv6 prefix length 0-128."
                requirements:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, hosts]
                    properties:
                      name:  { type: string, example: "site-a" }
                      hosts:
                        oneOf:
                          - type: integer
                            minimum: 1
                          - type: string
                            pattern: "^(\\d+|2\\^\\d{1,3})$"
                        example: 256
                        description: Positive integer or "2^N" string (e.g. "2^96").
      responses:
