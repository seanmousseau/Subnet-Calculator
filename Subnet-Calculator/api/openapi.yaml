        Returns the canonicalised address (compressed via inet_ntop), the zone
        identifier when present, an `is_link_local` flag (true when the
        address falls within `fe80::/10`), and a `warning` string when a zone
        identifier is supplied on a non-link-local address (zone IDs are only
        meaningful on link-local addresses). Added in v3.3.0.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneIdRequest" }
      responses:
