                  - type: object
                    properties:
                      data:
                        type: object
                        required: [address, zone_id, is_link_local, warning]
                        properties:
                          address:       { type: string, example: "fe80::1" }
                          zone_id:       { type: [string, "null"], example: "eth0" }
                          is_link_local: { type: boolean, example: true }
                          warning:       { type: [string, "null"], example: null }
