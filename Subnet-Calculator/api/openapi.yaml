  /supernet:
    post:
      operationId: supernet
      tags: [Supernet]
      summary: Find supernet or summarise IPv4 routes
      description: >
        Two modes: `find` returns the tightest supernet covering all input
        CIDRs; `summarise` returns the minimal set of covering prefixes using
        a greedy aggregation algorithm. Accepts IPv4 CIDRs only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cidrs]
              properties:
                action:
                  type: string
                  enum: [find, summarise]
                  default: find
                  description: "`find` returns the smallest enclosing supernet; `summarise` reduces to minimal covering prefixes."
                cidrs:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string }
                  example: ["10.0.0.0/24", "10.0.1.0/24"]
      responses:
        "200":
          description: Supernet or summarised routes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - type: object
                            required: [supernet]
                            properties:
                              supernet: { type: string, example: "10.0.0.0/23" }
                          - type: object
                            required: [summaries]
                            properties:
                              summaries:
                                type: array
                                items: { type: string }
              example:
                ok: true
                data:
                  supernet: "10.0.0.0/23"
        "400":
          description: Invalid input
          headers:
            X-RateLimit-Limit:     { $ref: "#/components/headers/XRateLimitLimit" }
