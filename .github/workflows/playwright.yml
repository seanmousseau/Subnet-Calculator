name: Playwright E2E

on:
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run Playwright tests
        # Use the Makefile entry point — it generates the per-run
        # PHPUNIT_TEST_DRAIN_TOKEN (#324) and forwards it through docker
        # compose to both webapp and playwright-tests. Bypassing the
        # Makefile leaves the drain endpoint inert and v3.1.0+ admin-drain
        # tests fail.
        run: make test-docker

      - name: Tear down containers
        if: always()
        run: docker compose down
