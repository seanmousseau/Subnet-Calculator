services:
  # Service hostname intentionally avoids the bare "app" name — Chrome 147+
  # under Playwright treats some single-label hostnames as eligible for
  # HTTPS auto-upgrade, which breaks plain-HTTP integration tests.
  webapp:
    build: .
    ports:
      - "8080:8080"
    environment:
      # v3.1.0 #324 — drain-endpoint token. Set per-run by `make test-docker`
      # via a one-shot `php -r 'bin2hex(random_bytes(16))'`. Empty in dev
      # `docker compose up` (the endpoint then 404s, fail-closed). Never
      # baked into the image, never committed.
      PHPUNIT_TEST_DRAIN_TOKEN: "${PHPUNIT_TEST_DRAIN_TOKEN:-}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 5s
      timeout: 5s
      retries: 10

  playwright-tests:
    build:
      context: .
      dockerfile: testing/Dockerfile.playwright
    depends_on:
      webapp:
        condition: service_healthy
    environment:
      APP_URL: "http://webapp:8080/"
      SKIP_SNAPSHOTS: "1"
      SKIP_LINT: "1"
      # No IPAM_BASIC_USER/PASS — no reverse proxy in Docker
      # v3.1.0 #324 — must match the token passed to webapp.
      PHPUNIT_TEST_DRAIN_TOKEN: "${PHPUNIT_TEST_DRAIN_TOKEN:-}"
    volumes:
      - ./testing/snapshots:/app/testing/snapshots
    working_dir: /app
